<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chatbot</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0f19;
      min-height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    #star-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
  </style>
</head>

<body>
  <!-- Clean Animated Moving Stars Background -->
  <canvas id="star-canvas"></canvas>

  <script>
    (function () {
      const canvas = document.getElementById('star-canvas');
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const starCount = 140;
      const stars = [];

      for (let i = 0; i < starCount; i++) {
        stars.push({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.35,
          vy: (Math.random() - 0.5) * 0.35,
          radius: Math.random() * 1.8 + 0.6,
          alpha: Math.random() * 0.7 + 0.3,
          twinkle: (Math.random() * 0.015 + 0.005) * (Math.random() > 0.5 ? 1 : -1),
          color: Math.random() > 0.25 ? '#ffffff' : (Math.random() > 0.5 ? '#38bdf8' : '#a855f7')
        });
      }

      function animate() {
        ctx.fillStyle = '#0b0f19';
        ctx.fillRect(0, 0, width, height);

        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          s.x += s.vx;
          s.y += s.vy;
          s.alpha += s.twinkle;

          if (s.alpha > 0.95 || s.alpha < 0.2) {
            s.twinkle = -s.twinkle;
          }

          if (s.x < 0) s.x = width;
          if (s.x > width) s.x = 0;
          if (s.y < 0) s.y = height;
          if (s.y > height) s.y = 0;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
          ctx.globalAlpha = Math.max(0.1, Math.min(1, s.alpha));
          ctx.fillStyle = s.color;
          ctx.shadowBlur = s.radius * 3;
          ctx.shadowColor = s.color;
          ctx.fill();
        }

        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>

  <!-- Load widget script -->
  <script type="module">
    const host = (window.location.origin && window.location.origin.includes(':8000'))
      ? window.location.origin
      : 'http://localhost:8000';
    const s = document.createElement('script');
    s.type = 'module';
    s.src = host + '/chat-widget.js';
    document.body.appendChild(s);
  </script>
</body>

</html>
